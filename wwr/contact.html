<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/contact_us.css">
    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, or support.">
    < </head>

<body>

    <header>
        <h1>White Water Rafting</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h2>Contact Information</h2>
            <p>Address: 123 River Road, Lagos, Nigeria</p>
            <p>Phone: +234 800 000 0000</p>
            <p>Email: info@rafting.com</p>
        </section>

        <section class="map">
            <h2>Our Location</h2>
            <!-- Replace src with your Google Map embed link -->
            <iframe src="https://www.google.com/maps?q=lagos&output=embed" loading="lazy"></iframe>
        </section>

        <section class="employees">
            <figure>
                <img src="images/emp1.jpg" alt="Manager">
                <figcaption>John – Manager</figcaption>
            </figure>

            <figure>
                <img src="images/emp2.jpg" alt="Tour Guide">
                <figcaption>Sarah – Tour Guide</figcaption>
            </figure>

            <figure>
                <img src="images/emp3.jpg" alt="Support Staff">
                <figcaption>Mike – Support Staff</figcaption>
            </figure>
        </section>

        <section>
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <label>Name</label>
                <input type="text" required>

                <label>Email</label>
                <input type="email" required>

                <p>Purpose:</p>
                <label><input type="radio" name="purpose"> General Inquiry</label><br>
                <label><input type="radio" name="purpose"> Reservation Question</label><br>
                <label><input type="radio" name="purpose"> Website Suggestion</label><br><br>

                <label>Message</label>
                <textarea rows="4"></textarea>

                <label>
                    <input type="checkbox"> Please subscribe me to the monthly newsletter
                </label><br><br>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting</p>
    </footer>

</body>

</html>
